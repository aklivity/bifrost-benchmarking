services:
  bifrost:
    image: maximhq/bifrost:${BIFROST_VERSION:-v2.3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.json:/app/data/config.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 1s
      retries: 60
    restart: unless-stopped
